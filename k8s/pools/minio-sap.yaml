# Pool: Security Assurance Pool
# NodePort: 30005 - UI: 30000
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-sap-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-sap
  labels:
    app: minio-sap
    pool: sap
spec:
  selector:
    matchLabels:
      app: minio-sap
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio-sap
        pool: sap
    spec:
      nodeSelector:
        node-role: worker
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: minio-sap-pvc
      containers:
      - name: minio
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        args:
        - server
        - --address
        - ":9000"
        - --console-address
        - ":9001"
        - /storage
        env:
        - name: MINIO_BROWSER_REDIRECT_URL
          value: "https://aegis.coevolution-project.eu/sap" 
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-sap-secret
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-sap-secret
              key: MINIO_ROOT_PASSWORD
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        volumeMounts:
        - name: storage
          mountPath: "/storage"
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: minio-sap-svc
  labels:
    app: minio-sap
    pool: sap
spec:
  type: NodePort
  selector:
    app: minio-sap
  ports:
  - name: api
    port: 9000
    targetPort: 9000
    nodePort: 30005
  - name: console
    port: 9001
    targetPort: 9001
    nodePort: 30000
